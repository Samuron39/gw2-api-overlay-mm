[package]
name = "gw2overlay_helper"
version = "0.1.0"
edition = "2021"
description = "Hjelper for GW2 Overlay: leser MumbleLink (mumble) og limer inn i spillets chat (paste)"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
