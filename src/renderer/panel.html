<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://render.guildwars2.com data:; style-src 'self' 'unsafe-inline'" />
  <title>GW2 Overlay-panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="grip" class="drag" title="Dra for å flytte panelet"></div>
  <header id="panelHeader">
    <div class="brand drag">GW2</div>
    <nav id="tabs"></nav>
    <div class="spacer drag"></div>
    <label class="inline" id="pinnedWrap" title="Hold panelet over spillet"><input type="checkbox" id="pinned" /> <span class="lbl" id="pinnedLbl">Øverst</span></label>
    <label class="inline" id="opacityWrap" title="Gjennomsiktighet"><input type="range" id="opacity" min="0.4" max="1" step="0.05" /></label>
    <button class="icon-btn" id="closeBtn" title="Skjul panel">✕</button>
  </header>
  <div id="status" class="status"></div>
  <main id="content"></main>

  <script src="i18n.js"></script>
  <script src="panel.js"></script>
  <script src="modules/inventory.js"></script>
  <script src="modules/daily.js"></script>
  <script src="modules/timers.js"></script>
  <script src="modules/tp.js"></script>
  <script src="modules/dps.js"></script>
  <script src="modules/live.js"></script>
  <script src="modules/characters.js"></script>
  <script src="modules/guild.js"></script>
  <script src="modules/guides.js"></script>
  <script src="modules/setup.js"></script>
  <script src="modules/settings.js"></script>
  <script src="init.js"></script>
</body>
</html>
